[package]
name = "mineflayer"
version = "0.1.0"
edition = "2024"
description = "The mineflayer bot API, ported to Rust on top of azalea"
license = "MIT"
readme = "README.md"
# No `repository`: the port has no public remote yet. `rust-version` is the
# pinned nightly's version (rust-toolchain.toml); a stable 1.101 cannot build
# azalea, so the field is a floor, not a promise of stable support.
rust-version = "1.101"
keywords = ["minecraft", "bot", "mineflayer", "azalea"]
categories = ["games"]

[features]
# Enables the tests in tests/live/ that talk to the local offline-mode
# fixture server (scripts/live-server.sh). Never used for Mojang traffic.
live = []

[dependencies]
azalea = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
# Every crate lock (see the lock policy in docs/PORT-PLAN.md): same no-
# poison lock family azalea uses for the ECS, and the version azalea-
# client compiles its `WorldHolder.shared` field with.
parking_lot = "0.12"
# Log facade (ruling in docs/PORT-PLAN.md, C1) — azalea already logs
# through `tracing`, and a dependent crate installs the subscriber.
tracing = "0.1"

[dev-dependencies]
# for the examples' RUST_LOG-driven subscriber (the crate itself only
# emits; it never installs a subscriber)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "live"
path = "tests/live/main.rs"
required-features = ["live"]

# NOTE: a crate that depends on this one must repeat this table in its
# own workspace (Cargo applies patches per workspace) — see the README
# section "Use as a dependency".
#
# The published azalea-protocol 0.16.0 serializes `ServerboundAttack`'s
# entity id as a fixed i32 while release MC 26.1 servers read a VarInt, so
# every `bot.attack()` gets the client kicked ("larger than I expected").
# Upstream fixed it in commit ddef371 ("fix attack packet was serialized
# incorrectly (#323)"), which is on the same 0.16.0+mc26.1 release line;
# no fixed release is published yet.
[patch.crates-io]
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "ddef37118448b639ff56b86ae339e8913cb4ed11" }
azalea-auth = { git = "https://github.com/azalea-rs/azalea", rev = "ddef37118448b639ff56b86ae339e8913cb4ed11" }
