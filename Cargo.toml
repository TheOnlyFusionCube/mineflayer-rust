[package]
name = "mineflayer"
version = "0.1.0"
edition = "2024"
description = "The mineflayer bot API, ported to Rust on top of azalea"
license = "MIT"

[features]
# Enables the tests in tests/live/ that talk to the local offline-mode
# fixture server (scripts/live-server.sh). Never used for Mojang traffic.
live = []

[dependencies]
azalea = "0.16"
# chat-component types (Style, ChatFormatting, TextColor) used by the
# scoreboard/team API — not re-exported through azalea::chat
azalea-chat = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# azalea types (BlockPos, ItemStack, HumanoidArm, …) appear in the public
# API, so live tests need the crate itself
azalea = "0.16"

[[test]]
name = "live"
path = "tests/live/lifecycle.rs"
required-features = ["live"]

[[test]]
name = "live_movement"
path = "tests/live/movement.rs"
required-features = ["live"]

[[test]]
name = "live-chat"
path = "tests/live/chat.rs"
required-features = ["live"]

[[test]]
name = "live_misc"
path = "tests/live/misc.rs"
required-features = ["live"]

[[test]]
name = "live_world"
path = "tests/live/world.rs"
required-features = ["live"]

[[test]]
name = "live-entity"
path = "tests/live/entity.rs"
required-features = ["live"]

[[test]]
name = "live_interact"
path = "tests/live/interact.rs"
required-features = ["live"]

[[test]]
name = "live_pathfinder"
path = "tests/live/pathfinder.rs"
required-features = ["live"]

[[test]]
name = "live-inventory"
path = "tests/live/inventory.rs"
required-features = ["live"]
