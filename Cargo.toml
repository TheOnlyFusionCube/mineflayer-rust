[package]
name = "mineflayer"
version = "0.1.0"
edition = "2024"
description = "The mineflayer bot API, ported to Rust on top of azalea"
license = "MIT"

[features]
# Enables the tests in tests/live/ that talk to the local offline-mode
# fixture server (scripts/live-server.sh). Never used for Mojang traffic.
live = []

[dependencies]
azalea = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "live"
path = "tests/live/lifecycle.rs"
required-features = ["live"]

[[test]]
name = "live-entity"
path = "tests/live/entity.rs"
required-features = ["live"]
