# Nightly is required (the engine crates use edition 2024 + #![feature] gates).
# Pinned to a dated nightly because nightly-2026-10-09 (the latest at scaffold
# time) has a rustc regression: it ICEs ("entered unreachable code" in
# rustc_next_trait_solver evaluate_const) compiling the entity and client engine crates.
# 2026-10-01 (1.101.0, commit 21b707e3f) + `-Znext-solver=no` (see
# .cargo/config.toml) builds the whole tree cleanly. Revisit the pin when
# rustc fixes the ICE.
# Review 2026-10-16: nightly-2026-10-15 (4ebd25825) still panics in
# rustc_infer (infer/mod.rs:1694) — on the entity engine crate without
# -Znext-solver=no, on the client engine crate with it. Pin and flag unchanged.
[toolchain]
channel = "nightly-2026-10-01"
components = ["rustfmt", "clippy"]
