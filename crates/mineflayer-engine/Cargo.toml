[package]
name = "mineflayer-engine"
description = "A framework for creating Minecraft bots."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mineflayer-auth.workspace = true
mineflayer-block.workspace = true
mineflayer-brigadier.workspace = true
mineflayer-buf.workspace = true
mineflayer-chat.workspace = true
mineflayer-client.workspace = true
mineflayer-core.workspace = true
mineflayer-entity.workspace = true
mineflayer-inventory.workspace = true
mineflayer-physics.workspace = true
mineflayer-protocol.workspace = true
mineflayer-registry.workspace = true
mineflayer-world.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
derive_more = { workspace = true, features = ["deref", "deref_mut"] }
futures.workspace = true
futures-lite.workspace = true
indexmap.workspace = true
nohash-hasher.workspace = true
num-format.workspace = true
num-traits.workspace = true
parking_lot.workspace = true
radix-heap.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true


[dev-dependencies]
eyre.workspace = true
parking_lot = { workspace = true, features = ["deadlock_detection"] }
rand.workspace = true
bevy_log.workspace = true

[features]
default = ["serde", "packet-event", "online-mode"]
# adds bevy_log::LogPlugin, which installs a global subscriber (off by default)
log = ["mineflayer-client/log"]
serde = ["dep:serde", "mineflayer-registry/serde", "mineflayer-world/serde"]
packet-event = ["mineflayer-client/packet-event"]
online-mode = ["mineflayer-client/online-mode"]


[lints]
workspace = true
