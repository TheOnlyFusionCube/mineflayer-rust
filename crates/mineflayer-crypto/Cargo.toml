[package]
name = "mineflayer-crypto"
description = "Cryptography features used in Minecraft."
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]

[dependencies]
aes.workspace = true
mineflayer-buf = { workspace = true, optional = true }
cfb8.workspace = true
num-bigint.workspace = true
rand = { workspace = true, features = ["sys_rng"] }
# TODO: Remove when rand is fixed.
rand_core.workspace = true
rsa = { workspace = true, features = ["sha2"] }
rsa_public_encrypt_pkcs1.workspace = true
sha1.workspace = true
sha2.workspace = true
uuid.workspace = true
md-5.workspace = true

[features]
signing = ["dep:mineflayer-buf"]


[lints]
workspace = true
