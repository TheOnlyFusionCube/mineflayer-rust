[package]
name = "mineflayer-core"
description = "Miscellaneous things in the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mineflayer-buf.workspace = true
mineflayer-registry.workspace = true
bevy_ecs = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
nohash-hasher.workspace = true
num-traits.workspace = true
simdnbt.workspace = true
tracing.workspace = true
mineflayer-chat = { workspace = true, features = ["simdnbt"] }
indexmap.workspace = true
crc32c.workspace = true
thiserror.workspace = true
uuid.workspace = true
derive_more = { workspace = true, features = ["deref", "deref_mut"] }

[features]
bevy_ecs = ["dep:bevy_ecs"]
serde = ["dep:serde", "mineflayer-registry/serde"]
strict_registry = []

[lints]
workspace = true
