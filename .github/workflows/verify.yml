# The verify gate (scripts/verify.sh: fmt, clippy, clippy with `live` and
# `test-util`, port and engine unit tests and doctests, the public-API
# plugin test, build, docs) and a live smoke
# subset on every push and pull request, and the whole live suite on a
# schedule and by hand.
name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml (the pinned nightly plus rustfmt and
      # clippy); .cargo/config.toml carries -Znext-solver=no. Do not use a
      # toolchain action that installs a different nightly.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # rust-cache prunes target/ to the dependency artifacts, so the entry
      # stays inside the 10 GB repository cache limit (a full local target/
      # grows to tens of GB). The toolchain file is part of its cache key.
      - uses: Swatinem/rust-cache@v2

      - name: Verify
        run: bash scripts/verify.sh

  # Three live tests (lifecycle, chat, movement) on every push, so that a
  # wire regression fails the commit that caused it; same fixture and jar
  # cache as the live job below.
  live-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/cache@v4
        with:
          path: |
            .live/server.jar
            .live/jar-version.txt
          key: live-server-${{ hashFiles('Cargo.lock') }}

      - name: Start the fixture on a reset world
        run: bash scripts/live-server.sh reset

      - name: Live smoke tests
        run: >-
          cargo test --features live --test live --no-fail-fast --
          --ignored --test-threads=1 lifecycle:: chat:: movement::

      - name: Stop the fixture
        if: always()
        run: bash scripts/live-server.sh stop

  # The live suite against the local fixture server (scripts/live-server.sh):
  # the only test of the port and the engine together on the wire. The
  # fixture is an offline-mode server on localhost; nothing connects to
  # Mojang session servers or public servers. The script downloads the
  # server jar from Mojang's release manifest, so the jar is cached.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # the server release needs Java 25; with it installed the script does
      # not download a JRE into .live/jdk/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # the jar follows the Minecraft version in the engine's version, which
      # Cargo.lock carries
      - uses: actions/cache@v4
        with:
          path: |
            .live/server.jar
            .live/jar-version.txt
          key: live-server-${{ hashFiles('Cargo.lock') }}

      - name: Start the fixture on a reset world
        run: bash scripts/live-server.sh reset

      - name: Live suite
        run: cargo test --features live --no-fail-fast -- --ignored --test-threads=1

      - name: Stop the fixture
        if: always()
        run: bash scripts/live-server.sh stop
